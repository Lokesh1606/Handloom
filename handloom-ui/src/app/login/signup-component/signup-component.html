<app-alert-component *ngIf="alertVisible" [message]="alertMessage" (closed)="hideAlert()"></app-alert-component>

<div class="signup-card">
  <div class="title">Create Account</div>
  <form [formGroup]="signup">
    <div>
      <label>Email Id</label>
      <input formControlName="email" placeholder="Email address" />
    </div>

    <div>
      <label>Username</label>
      <input formControlName="username" placeholder="Username" />
    </div>

    <div>
      <label>Password</label>
      <input formControlName="password" placeholder="Password" type="password" />
    </div>

    <div>
      <label>Confirm Password</label>
      <input formControlName="confirmPassword" placeholder="Confirm Password" type="password" />
    </div>

    <div>
      <button type="button" (click)="submit()" [disabled]="isLoading">{{ isLoading ? 'Creating Account...' : 'Create Account' }}</button>
    </div>
  </form>
  <div class="login-link">
    <span>Already have an account? <a routerLink="/login">Login</a></span>
  </div>
</div>
