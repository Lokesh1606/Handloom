<app-alert-component *ngIf="alertVisible" [message]="alertMessage" (closed)="hideAlert()"></app-alert-component>

<div class="login-card">
  <div class="title">Login</div>
  <form [formGroup]="login">
    <div>
      <label>Email Id</label>
      <input formControlName="emailid" placeholder="Email id" />
    </div>

    <div>
      <label>Password</label>
      <input formControlName="password" placeholder="Password" type="password" />
    </div>

    <div>
      <button type="button" (click)="submit()" [disabled]="isLoading">{{ isLoading ? 'Submitting...' : 'Submit' }}</button>
    </div>
  </form>
  <div class="signup-link">
    <span>Don't have an account? <a routerLink="/signup">Create Account</a></span>
  </div>
</div>
