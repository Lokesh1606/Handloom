<div class="page-center">
    <div class="container">
        <div>
            <h2 class="signup">Sign Up</h2>
        </div>
        <div class="form-fields">
            <p-inputgroup>
                <p-inputgroup-addon>
                    <i class="pi pi-user"></i>
                </p-inputgroup-addon>
                <input pInputText [formControl]="firstName" placeholder="First Name" />
            </p-inputgroup>
             <p-inputgroup>
                <p-inputgroup-addon>
                    <i class="pi pi-user"></i>
                </p-inputgroup-addon>
                <input pInputText [formControl]="lastName" placeholder="Last Name" />
            </p-inputgroup>
            <p-inputgroup>
                <p-inputgroup-addon>@</p-inputgroup-addon>
                <input pInputText  [formControl]="emailAddress" placeholder="Email Address" />
            </p-inputgroup>
            <p-inputgroup>
                <p-inputgroup-addon>
                    <i class="pi pi-address-book" style="font-size: 1.4rem"></i>
                </p-inputgroup-addon>
                <p-inputmask mask="9999999999" [formControl]="phoneNumber" placeholder="9999999999" />
            </p-inputgroup>
             <p-inputgroup>
                <p-inputgroup-addon>
                    <i class="pi pi-key" style="font-size: 1.4rem"></i>
                </p-inputgroup-addon>
                <p-password [formControl]="password" [toggleMask]="true" />
            </p-inputgroup>
        </div>
        <div>
            <p-button class="submit-class" label="Submit" [disabled]="!this.form.valid" (onClick)="submit()" />
        </div>
        <div style="text-align: center;">
            <span>Already have an account? <a href="/login">Login</a></span>
        </div>
    </div>
    

</div>
